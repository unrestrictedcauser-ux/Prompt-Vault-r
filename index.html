<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b2d"><link rel="manifest" href="manifest.webmanifest"><title>Kat's Prompt Vault</title><style>:root{font-family:system-ui,sans-serif;color:#f4f5fb;background:#101525}*{box-sizing:border-box}body{margin:0;max-width:800px;padding:20px 16px 80px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.55rem;margin:8px 0}p,small{color:#b8c1d6}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:#6878f7;color:white;font-weight:600;cursor:pointer}button.secondary{background:#293249}button.danger{background:#663047}input,textarea,select{background:#1c2539;color:white;border:1px solid #39445d;border-radius:10px;padding:12px;width:100%}textarea{min-height:140px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar>*{flex:1}.card{background:#1b2438;border:1px solid #35415c;border-radius:16px;padding:16px;margin:12px 0}.card h3{margin:0 0 5px}.card pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c5cde0;max-height:100px;overflow:hidden;font:inherit;font-size:.9rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.tag{color:#a9b6ff;font-size:.8rem}.hidden{display:none}dialog{width:min(95vw,600px);background:#192237;color:white;border:1px solid #53617b;border-radius:18px;padding:20px}dialog::backdrop{background:#000a}form{display:grid;gap:12px}label{display:grid;gap:6px}footer{font-size:.8rem;color:#aab4c9;margin-top:25px}#status{min-height:20px;color:#b6e6c8}</style></head><body><header><div><h1>Kat's Prompt Vault</h1><small>Save once. Find fast. Copy instantly.</small></div><button id="add">+ New</button></header><div class="toolbar"><input id="search" type="search" placeholder="Search prompts and snippets" aria-label="Search saved items"><select id="filter" aria-label="Filter category"><option value="">All categories</option></select></div><div class="toolbar"><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input class="hidden" type="file" id="file" accept="application/json,.json"></div><div id="status" role="status"></div><main id="items"></main><footer>Saved locally on this device. Export backups regularly; browser data can be cleared. No account or tracking.</footer><dialog id="editor"><form id="form"><h2 id="heading">New item</h2><label>Title<input id="title" maxlength="120" required placeholder="e.g. Independent research prompt"></label><label>Category<input id="category" list="categories" placeholder="Research, GitHub, Code..."><datalist id="categories"><option value="Research"><option value="Code"><option value="GitHub"><option value="Audit"><option value="Other"></datalist></label><label>Text to copy<textarea id="content" required placeholder="Paste your prompt or snippet here"></textarea></label><div class="actions"><button type="submit">Save item</button><button type="button" class="secondary" id="cancel">Cancel</button></div></form></dialog><script>const KEY='kat-prompt-vault-v1';let data=[];let editing=null;const $=id=>document.getElementById(id);function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(v)?v:[]}catch{data=[];notice('Could not read saved items. Restore from a backup if available.')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{notice('Storage failed. Export a backup to avoid losing changes.');return false}}function notice(s){$('status').textContent=s}function render(){let cats=[...new Set(data.map(x=>x.category).filter(Boolean))].sort();let chosen=$('filter').value;$('filter').replaceChildren(new Option('All categories',''),...cats.map(c=>new Option(c,c)));$('filter').value=cats.includes(chosen)?chosen:'';let q=$('search').value.toLowerCase(),f=$('filter').value;let rows=data.filter(x=>(!f||x.category===f)&&[x.title,x.category,x.content].join(' ').toLowerCase().includes(q));$('items').replaceChildren();if(!rows.length){let p=document.createElement('p');p.textContent=data.length?'No matching items.':'Your vault is empty. Tap + New to save your first prompt.';$('items').append(p)}for(let x of rows){let card=document.createElement('article');card.className='card';let h=document.createElement('h3');h.textContent=x.title;let tag=document.createElement('div');tag.className='tag';tag.textContent=x.category||'Uncategorized';let pre=document.createElement('pre');pre.textContent=x.content;let actions=document.createElement('div');actions.className='actions';for(let [label,fn,cls] of [['Copy',()=>copy(x.content),''],['Edit',()=>openEditor(x),'secondary'],['Delete',()=>remove(x.id),'danger']]){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;actions.append(b)}card.append(h,tag,pre,actions);$('items').append(card)}}async function copy(s){try{await navigator.clipboard.writeText(s);notice('Copied to clipboard.')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();notice(ok?'Copied to clipboard.':'Copy unavailable. Open Edit and select the text.')}}function openEditor(x){editing=x?.id??null;$('heading').textContent=x?'Edit item':'New item';$('title').value=x?.title||'';$('category').value=x?.category||'';$('content').value=x?.content||'';$('editor').showModal()}function remove(id){if(confirm('Delete this saved item?')){data=data.filter(x=>x.id!==id);persist();render()}}$('form').onsubmit=e=>{e.preventDefault();let item={id:editing||crypto.randomUUID(),title:$('title').value.trim(),category:$('category').value.trim(),content:$('content').value};if(!item.title||!item.content.trim())return;if(editing){data=data.map(x=>x.id===editing?item:x)}else data.unshift(item);persist();$('editor').close();notice('Item saved.');render()};$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Kat Prompt Vault',version:1,items:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='prompt-vault-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Backup downloaded.')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let raw=JSON.parse(await file.text());let items=Array.isArray(raw)?raw:raw.items;if(!Array.isArray(items)||!items.every(x=>x&&typeof x.title==='string'&&typeof x.content==='string'))throw Error('Invalid backup');if(!confirm('Import '+items.length+' items? Existing items will be kept; matching IDs will be updated.'))return;let map=new Map(data.map(x=>[x.id,x]));for(let x of items){let id=typeof x.id==='string'&&x.id?x.id:crypto.randomUUID();map.set(id,{id,title:x.title,category:typeof x.category==='string'?x.category:'',content:x.content})}data=[...map.values()];persist();render();notice('Backup imported.')}catch{notice('Import failed: invalid JSON backup.')}finally{e.target.value=''}};load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
